<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) i admit orz -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-2JF98YWFHK"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-2JF98YWFHK");
    </script>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "SUSE";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url(/fonts/suse/regular.ttf) format("truetype");
      }
      @font-face {
        font-family: "SUSE";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url(/fonts/suse/bold.ttf) format("truetype");
      }
    </style>
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    %sveltekit.head%
  </head>
  <body
    data-sveltekit-preload-data="hover"
    class="bg-gradient"
    style="transition: none"
  >
    <script>
      try {
        const userTheme =
          localStorage.getItem("zoron.dev.theme") ||
          localStorage.getItem("zoron.prod.theme") ||
          "zoron";
        if (JSON.parse(userTheme) === "amoled") {
          document.body.classList.add("bg-black");
          document.body.classList.remove("bg-gradient");
        }
        document.body.style.transition = "";
      } catch {}
    </script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
